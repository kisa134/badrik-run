<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BADRIK: Solana Cyber Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MENU -->
    <div id="menu">
        <canvas id="menuCanvas"></canvas>
        
        <div class="menu-ui">
            <h1 class="title">BADRIK</h1>
            <p class="subtitle">SOLANA CYBER RUNNER</p>
            
            <button id="playBtn" class="neon-btn">▶ PLAY</button>
            
            <div class="wallet-section">
                <button id="connectWallet" class="neon-btn small">Connect Wallet</button>
                <div id="walletInfo" style="display: none;">
                    <span class="wallet-address"></span>
                </div>
            </div>
            
            <div class="best-score">
                BEST: <span id="menuBestScore">0</span>
            </div>
        </div>
    </div>
    
    <!-- GAME -->
    <div id="gameContainer" style="display: none;">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud">
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <span id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SHARDS</span>
                <span id="shards">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">DIST</span>
                <span id="distance">0m</span>
            </div>
        </div>
    </div>
    
    <!-- GAME OVER -->
    <div id="gameOver" style="display: none;">
        <div class="game-over-box">
            <h2>GAME OVER</h2>
            
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">SCORE</span>
                    <span id="finalScore">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">SHARDS</span>
                    <span id="finalShards">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">DISTANCE</span>
                    <span id="finalDistance">0m</span>
                </div>
                <div class="stat best">
                    <span class="stat-label">BEST</span>
                    <span id="bestScore">0</span>
                </div>
            </div>
            
            <div class="buttons">
                <button id="playAgain" class="neon-btn">▶ PLAY AGAIN</button>
                <button id="backToMenu" class="neon-btn small">MENU</button>
            </div>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
